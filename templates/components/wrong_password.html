{% if messages %}
    {% for message in messages %}
        {% if message.tags == 'error' %}
            <div id="error-popover" class="component-modal" popover="auto">
                <div class="component-modal__content">
                    <button type="button" 
                            class="component-modal__close" 
                            popovertarget="error-popover" 
                            popovertargetaction="hide"
                            aria-label="Tutup modal">×</button>
                    
                    <h2>Akses Ditolak!</h2>
                    <p>{{ message }}</p>

                    <div class="component-modal__actions">
                        <button type="button" 
                                class="button button-secondary" 
                                popovertarget="error-popover" 
                                popovertargetaction="hide">Tutup</button>
                    </div>
                </div>
            </div>

            <script>
                document.addEventListener("DOMContentLoaded", () => {
                    const errorPopover = document.getElementById("error-popover");
                    if (errorPopover && errorPopover.showPopover) {
                        errorPopover.showPopover();
                    }
                });
            </script>
        {% endif %}
    {% endfor %}
{% endif %}
