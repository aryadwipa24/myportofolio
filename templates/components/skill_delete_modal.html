<div id="delete-skill" class="component-delete-modal" popover="auto">
    <button type="button"
            class="component-delete-modal__backdrop"
            popovertarget="delete-skill"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="component-delete-modal__content">
        <button type="button"
                class="component-delete-modal__close"
                popovertarget="delete-skill"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        
        <h2>Centang Riwayat Pendidikan yang Ingin Dihapus</h2>
        
        <form method="post" action="{% url 'main:delete_skill' %}">
            {% csrf_token %}
            {% include 'components/password.html' %}
            <div class="delete-checkbox-list">
                {% for skill in skill_list %}
                    <div class="checkbox-item">
                        <input type="checkbox" 
                               id="skill-{{ skill.id }}" 
                               name="selected_skills" 
                               value="{{ skill.id }}">
                        <label for="skill-{{ skill.id }}">{{ skill.title }}</label>
                    </div>
                {% empty %}
                    <p>Tidak ada data untuk dihapus.</p>
                {% endfor %}
            </div>

            <div class="component-delete-modal__actions">
                <button type="button"
                class="button button-secondary"
                popovertarget="delete-skill"
                popovertargetaction="hide">Batal</button>
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </div>
        </form>
    </div>
</div>
