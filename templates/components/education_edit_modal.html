<div id="edit-education-modal" class="component-delete-modal" popover="auto">
    <div class="component-delete-modal__content">
        <button type="button" 
                class="component-delete-modal__close" 
                popovertarget="edit-education-modal" 
                popovertargetaction="hide"
                aria-label="Tutup modal">×</button>
        
        <h2>Pilih Pendidikan yang Ingin Diubah</h2>
        <p>Klik salah satu untuk mengedit datanya:</p>

        <div class="edit-select-list">
            {% for education in education_list %}
                <a href="{% url 'main:edit_education' education.id %}" 
                   class="button button-secondary">
                    {{ education.title }}
                </a>
            {% empty %}
                <p>Belum ada data untuk diubah.</p>
            {% endfor %}
        </div>

        <div class="component-delete-modal__actions">
            <button type="button" 
                    class="button button-secondary" 
                    popovertarget="edit-education-modal" 
                    popovertargetaction="hide">Batal</button>
        </div>
    </div>
</div>
