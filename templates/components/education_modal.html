<div id="delete-education" class="component-modal" popover="auto">
    <button type="button"
            class="component-modal__backdrop"
            popovertarget="delete-education"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="component-modal__content">
        <button type="button"
                class="component-modal__close"
                popovertarget="delete-education"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        
        <h2>Centang Riwayat Pendidikan yang Ingin Dihapus</h2>
        
        <form method="post" action="{% url 'main:delete_education' %}">
            {% csrf_token %}
            
            <div id="delete-checkbox-list" class="delete-checkbox-list"></div>

            <div class="component-modal__actions">
                <button type="button"
                class="button button-secondary"
                popovertarget="delete-education"
                popovertargetaction="hide">Batal</button>
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </div>
        </form>
    </div>
</div>

<div id="edit-education-modal" class="component-modal" popover="auto">
    <div class="component-modal__content">
        <button type="button" 
                class="component-modal__close" 
                popovertarget="edit-education-modal" 
                popovertargetaction="hide"
                aria-label="Tutup modal">×</button>
        
        <h2>Pilih Pendidikan yang Ingin Diubah</h2>
        <p>Klik salah satu untuk mengedit datanya:</p>

        <div class="edit-select-list">
            <div id="edit-select-list" class="edit-select-list"></div>
        </div>

        <div class="component-modal__actions">
            <button type="button" 
                    class="button button-secondary" 
                    popovertarget="edit-education-modal" 
                    popovertargetaction="hide">Batal</button>
        </div>
    </div>
</div>
