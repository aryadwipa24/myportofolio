<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill - {{ name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="#profile" class="brand">{{ name }}</a>
            <nav>
                <ul>
                    <li>
                        <a class="section-navbar" href="#">Section List ▾</a>
                        <ul class="dropdown">
                            <li><a href="{% url 'main:show_main' %}">Profile</a></li>
                            <li><a href="{% url 'main:show_experience' %}">Experience</a></li>
                            <li><a href="{% url 'main:show_skill' %}">Skill</a></li>
                            <li><a href="#education">Education</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <section class="border-line skill-section" id="skill">
            <div class="container">
                <h2 class="title">My Skills</h2>
                
                <ul class="list-default skill-list">
                    {% for skill in skill_list %}
                        <li>
                            <img src="{{ skill.image }}">
                            <span>{{ skill.title }}</span>
                        </li>
                        {% empty %}
                        <div class="empty-state">
                            <h3>Belum ada skill yang ditambahkan.</h3>
                        </div>
                        {% endfor %}
                </ul>
            </div>
        </section>

    </main>

    <footer class="border-line site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
